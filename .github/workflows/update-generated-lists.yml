name: Update RouterOS service lists

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "categories/**/database/**"
      - ".github/workflows/update-generated-lists.yml"
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-routeros-service-lists
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit repository structure
        run: sh ./scripts/audit-migration.sh

      - name: Generate RouterOS lists and install guides
        run: sh ./scripts/build-all.sh

      - name: Validate generated files
        run: sh ./scripts/validate-all.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find categories safe-install -type f \( -name '*.rsc' -o -name 'README.md' \) -print0 | xargs -0 -r git add

          if git diff --cached --quiet; then
            echo "No generated list or documentation changes"
            exit 0
          fi

          git commit -m "Update generated RouterOS lists and install guides"

          attempt=1
          while [ "$attempt" -le 3 ]; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 2
          done

          echo "Failed to push generated updates after 3 attempts" >&2
          exit 1
