# managed-by=mohavise-mikrotik-dns-policy-routing
# project=mikrotik-dns-policy-routing
# service=aws
# do-not-edit-generated-files

SERVICE_ID="aws"
SERVICE_NAME="Amazon Web Services"
LIST_NAME="DST-AWS-TO-OUTBOUND"
LIST_NAME_PATTERN="DST-<GROUP>-TO-<TARGET>"

DOMAIN_SOURCE_NAME="AWS official website and console allowlist"
DOMAIN_SOURCE_TYPE="official-control-plane-domains"

CIDR_SOURCE_URL="https://ip-ranges.amazonaws.com/ip-ranges.json"
CIDR_SOURCE_NAME="AWS official public IPv4 ranges"
CIDR_SOURCE_TYPE="official-provider-feed"
CIDR_SOURCE_FORMAT="aws-json"

DOMAIN_COMMENT_PREFIX="aws:"
CIDR_COMMENT="aws-cidr"

MIN_DOMAIN_RULES=5
MIN_CIDR_RULES=500
