# project=mikrotik-dns-policy-routing
# service=google-drive
# do-not-edit-generated-files

SERVICE_ID="google-drive"
SERVICE_NAME="Google Drive"
LIST_NAME="DST-GOOGLE-DRIVE-TO-OUTBOUND"
LIST_NAME_PATTERN="DST-<GROUP>-TO-<TARGET>"

DOMAIN_SOURCE_NAME="Google Drive public/service domains"
DOMAIN_SOURCE_TYPE="official-google-service-domains"

CIDR_SOURCE_URL="https://www.gstatic.com/ipranges/goog.json"
CIDR_SOURCE_NAME="Google official public IPv4 ranges"
CIDR_SOURCE_TYPE="official-provider-feed"
CIDR_SOURCE_FORMAT="google-json"

DOMAIN_COMMENT_PREFIX="google-drive:"
CIDR_COMMENT="google-drive-cidr"

MIN_DOMAIN_RULES=8
MIN_CIDR_RULES=20

