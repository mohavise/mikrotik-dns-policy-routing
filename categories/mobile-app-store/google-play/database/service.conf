# managed-by=mohavise-mikrotik-dns-policy-routing
# project=mikrotik-dns-policy-routing
# service=google-play
# do-not-edit-generated-files

SERVICE_ID="google-play"
SERVICE_NAME="Google Play"
LIST_NAME="DST-GOOGLE-PLAY-TO-OUTBOUND"
LIST_NAME_PATTERN="DST-<GROUP>-TO-<TARGET>"

DOMAIN_SOURCE_NAME="Android Enterprise Network Requirements"
DOMAIN_SOURCE_TYPE="official-vendor-docs"

CIDR_SOURCE_URL="https://www.gstatic.com/ipranges/goog.json"
CIDR_SOURCE_NAME="Google official public IPv4 ranges"
CIDR_SOURCE_TYPE="official-provider-feed"
CIDR_SOURCE_FORMAT="google-json"

DOMAIN_COMMENT_PREFIX="google-play:"
CIDR_COMMENT="google-play-cidr"

MIN_DOMAIN_RULES=35
MIN_CIDR_RULES=20
